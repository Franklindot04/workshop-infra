openapi: 3.0.3
info:
  title: Collector API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Check service health
      responses:
        '200':
          description: The collector is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok
